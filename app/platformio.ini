; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env:esp32s3]
; platform = https://github.com/platformio/platform-espressif32.git
platform = espressif32 @ 6.10.0
board = esp32-s3-thermostat
board_build.mcu = esp32s3
board_build.partitions = default_16mb.csv
framework = espidf
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_speed = 921600
upload_port = /dev/ttyACM0

build_unflags = 
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17

build_flags = 
	-std=gnu++2a
  -Wno-error
	-Wno-format
	-Wno-error=format
  -Wno-unused-variable
  -Wno-unused-function
  -Wno-unused-but-set-variable
  # Force ESP-IDF to embed ANSI color codes back into the firmware binary (also set in sdkconfig)
	-D CONFIG_LOG_COLORS=1
	-I include/
	-D LV_CONF_INCLUDE_SIMPLE
	-D MQTT_ENABLED
	-D TELNET_ENABLED
  ;;  -I ~/.platformio/packages/framework-espidf/components/mqtt/esp-mqtt/include/
	;;	-D MATTER_ENABLED

;; monitor_raw = yes

lib_compat_mode = off	;; To enable Arduino LD2410 library to be included
lib_deps = 
	rzeldent/micro-timezonedb@^1.0.4
	;;;mattfryer/Smoothed@^1.2.0
  https://github.com/smeisner/Smoothed
	lvgl/lvgl@^8.4.0
	lovyan03/LovyanGFX@^1.1.12
	ncmreynolds/ld2410@^0.2.2
	bblanchon/ArduinoJson@^7.0.4
debug_init_break = tbreak app_main
monitor_filters = 
	esp32_exception_decoder
	time
