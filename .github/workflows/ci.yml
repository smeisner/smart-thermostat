name: CI

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0, v2.1, etc.
      - 'V*' # Triggers on semantic version tags like V1.0.0, V2.1, etc.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build
        run: pio run

      # Target the exact proven directory and force v4 to scan hidden dot-folders
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            app/.pio/build/esp32s3/firmware.bin
            app/.pio/build/esp32s3/firmware.elf
          include-hidden-files: true
          if-no-files-found: error

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated firmware release for ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Point exactly to the verified build subfolder location
      - name: Upload firmware to release
        run: |
          gh release upload ${{ github.ref_name }} \
            .pio/build/esp32s3/firmware.bin \
            .pio/build/esp32s3/firmware.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
