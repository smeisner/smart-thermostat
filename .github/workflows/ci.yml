name: CI

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0, v2.1, etc.
      - 'V*' # Triggers on semantic version tags like V1.0.0, V2.1, etc.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.0  # Or keep an eye out for upcoming major updates

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build
        run: pio run

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: firmware-mqtt-and-matter
          path: |
            app/.pio/build/esp32s3/firmware.bin
            app/.pio/build/esp32s3/firmware.elf
            app/.pio/build/esp32s3-matter/firmware.bin
            app/.pio/build/esp32s3-matter/firmware.elf
          include-hidden-files: true
          if-no-files-found: error

      - name: Create GitHub Release
        run: |
          gh release delete ${{ github.ref_name }} --yes 2>/dev/null || true
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated firmware release for ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload firmware to release
        run: |
          cp .pio/build/esp32s3/firmware.bin .pio/build/firmware-mqtt.bin
          cp .pio/build/esp32s3/firmware.elf .pio/build/firmware-mqtt.elf
          cp .pio/build/esp32s3-matter/firmware.bin .pio/build/firmware-matter.bin
          cp .pio/build/esp32s3-matter/firmware.elf .pio/build/firmware-matter.elf
          gh release upload ${{ github.ref_name }} \
            .pio/build/firmware-mqtt.bin \
            .pio/build/firmware-mqtt.elf \
            .pio/build/firmware-matter.bin \
            .pio/build/firmware-matter.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
