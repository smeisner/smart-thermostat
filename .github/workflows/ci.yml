name: CI

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0, v2.1, etc.
      - 'V*' # Triggers on semantic version tags like V1.0.0, V2.1, etc.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # Set the working directory globally for all steps in this job
    defaults:
      run:
        working-directory: app

    steps:
      # Note: Checkout must happen at the root, it handles working-directory automatically
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: '.'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installed globally on the runner, but runs from the app/ context safely
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      # Removed '-d app/' because defaults.run makes the runner execute inside app/ automatically
      - name: Build
        run: pio run

      # Replaced hardcoded 'esp32s3' with a wildcard '**' to automatically catch the exact environment name
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/**/*.bin
            .pio/build/**/*.elf
          if-no-files-found: error

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated firmware release for ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Wildcard usage here ensures gh upload finds the files regardless of the target folder name
      - name: Upload firmware to release
        run: |
          gh release upload ${{ github.ref_name }} .pio/build/**/*.bin .pio/build/**/*.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
